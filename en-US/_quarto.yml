project:
  type: book
  output-dir: _book

lang: en

book:
  title: "Introduction to Plant Bioinformatics"
  author: "Rhosiqs"
  date: last-modified
  repo-url: https://github.com/rhosiqs/bioinfo-intro
  repo-subdir: en-US
  repo-actions: [edit, issue]
  output-file: handbook-en
  downloads: [pdf]
  chapters:
    - index.qmd

# Renders the per-page created / last-updated line (dates come from the
# front matter, which tools/sync.py keeps up to date).
filters:
  - ../tools/page-meta.lua
  - ../tools/contributors.lua   # PDF fallback for the contributor wall (_shared/contributors.html)

format:
  html:
    theme: cosmo
    code-copy: true
    include-in-header:
      - ../_shared/lang-switch.html
      - ../_shared/page-meta.html
      - ../_shared/part-numbers.html
      - ../_shared/contributors.html
  typst:
    papersize: a4
    # CJK fallback: untranslated pages still show the Chinese original.
    include-in-header:
      text: |
        #set text(font: ("Libertinus Serif", "Noto Serif CJK TC"))
        #show raw: set text(font: ("DejaVu Sans Mono", "Noto Sans CJK TC"))
