<script>
// Language switch: make the sidebar "translate" icon open the SAME page in the
// other edition (en-US <-> zh-TW), keeping the #section anchor.
// Relies on identical relative file paths under both edition directories.
// Without JS the icon still works; it just lands on the other edition's front page.
(function () {
  var LANGS = ["en-US", "zh-TW"];
  var re = new RegExp("/(" + LANGS.join("|") + ")/");
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a.quarto-navigation-tool");
    if (!a) return;
    var here = window.location.pathname.match(re);
    var dest = new URL(a.href, window.location.href).pathname.match(re);
    if (!here || !dest || here[1] === dest[1]) return;       // not a language link
    var p = window.location.pathname;
    var rest = p.slice(here.index + here[0].length);          // e.g. chapters/01-fastq.html
    ev.preventDefault();
    window.location.href = p.slice(0, here.index) + "/" + dest[1] + "/" + rest + window.location.hash;
  }, true);
})();
</script>
